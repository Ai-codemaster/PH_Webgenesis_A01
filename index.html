<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGO</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>

    <!-- Header Section -->
    <header class="header">
      <nav class="navbar">
        <a href="#">lOGO</a>
        <button class="btn_primary">Sign Up</button>

      <h1>
        Cool Dark UI Template for <br />
        Webflow Agencies!

    </header>

    <main>
      <!-- Action Section -->

      <section class="action">
        <div>
          <h2>See It in Action</h2>
          <p>
            Explore the live preview and imagine your <br />
            brand in this bold new look.
          </p>
          <button class="btn_primary">Launch Live Preview</button>
        </div>
        <img src="Assets/wc-mini.png" alt="" />

      <!-- Productive User Section -->

      <section class="productive">
        <h1>Joined Thousands of Productive Users</h1>
        <div>
          <div>
            <h3>50K</h3>
            <p>Active Users</p>
          </div>
          <div>
            <h3>2M+</h3>
            <p>Focus Sessions</p>
          </div>
          <div>
            <h3>95%</h3>
            <p>Satisfaction Rate</p>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
